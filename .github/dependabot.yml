version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # @release-it-plugins/lerna-changelog declares the release-it majors it
      # supports, and release-it refuses to start outside them. CI never runs
      # release-it, so a major bump only fails at release time. Raise this by
      # hand once the plugin supports the new major.
      - dependency-name: 'release-it'
        update-types: ['version-update:semver-major']
      # tsup's .d.ts build uses the TypeScript 5 compiler API (see #110)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      docusaurus:
        applies-to: version-updates
        patterns:
          - '@docusaurus/*'
      docusaurus-security:
        applies-to: security-updates
        patterns:
          - '@docusaurus/*'
      unified-ecosystem:
        patterns:
          - 'unified'
          - 'rehype-*'
          - 'remark-*'
          - 'hast-util-*'
      mcp:
        patterns:
          - '@modelcontextprotocol/*'
          - '@gleanwork/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vite' # vitest's peer; bump them together
          - '@playwright/*'
      react:
        # react-dom refuses to run unless react is the exact same version
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
