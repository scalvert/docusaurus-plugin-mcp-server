name: Website

# Builds the docs site against the plugin at this commit and smoke-tests its
# MCP endpoint. Deploys happen only on release tags (deploy-website.yml).
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      # The site installs the plugin from the repo root (file:..), so build it first.
      - name: Install and build the plugin
        run: |
          npm ci
          npm run build

      - name: Check code snippets in README and docs
        run: npm run snippets:check

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      # postbuild runs docusaurus-mcp-verify on the artifact bundle.
      - name: Build the site
        working-directory: website
        run: npm run build

      - name: Smoke-test the MCP endpoint
        working-directory: website
        run: npm run smoke

      # skills/guides/<guide>/ are copies of the guides this site compiles from its
      # pages, for `npx skills add`. Fails if a page changed without a sync.
      - name: Check the repo's guide skills match the site
        working-directory: website
        run: npm run skills:check
